<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Responsive Items</title>

<style>
/* ---------- BASIC ---------- */
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    padding: 16px;
}

button {
    cursor: pointer;
}

/* ---------- CARD ---------- */
.item-card {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
}

.item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    cursor: pointer;
    background: #f9fafb;
}

.item-header strong {
    font-size: 14px;
}

.item-body {
    display: none;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
}

.item-card.active .item-body {
    display: block;
}

/* ---------- GRID ---------- */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.field label {
    font-size: 11px;
    color: #6b7280;
}

.field input,
.field select {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
}

/* ---------- TOTAL ---------- */
.total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-weight: bold;
}

/* ---------- DESKTOP TABLE ---------- */
@media (min-width: 768px) {
    .item-card {
        display: grid;
        grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr;
        align-items: center;
        padding: 12px;
    }

    .item-header,
    .item-body {
        display: contents;
    }

    .item-header {
        cursor: default;
    }

    .grid {
        grid-template-columns: repeat(6, 1fr);
    }
}
</style>
</head>
<body>

<h2>Invoice Items</h2>

<div id="items"></div>

<button onclick="addItem()">+ Add Item</button>

<!-- <script src="app.js"></script> -->

<script>
    const dummyProducts = [
    {
        name: "Sterling Ring",
        rate: 14000,
        stone: 20,
        gst: 3
    },
    {
        name: "Gold Chain",
        rate: 5200,
        stone: 10,
        gst: 3
    }
];

const itemsContainer = document.getElementById("items");

function addItem() {
    const product = dummyProducts[0];

    const card = document.createElement("div");
    card.className = "item-card";

    card.innerHTML = `
        <div class="item-header" onclick="toggleCard(this)">
            <strong>${product.name}</strong>
            <span>₹ <span class="total">0</span></span>
        </div>

        <div class="item-body">
            <div class="grid">
                <div class="field">
                    <label>Qty</label>
                    <input type="number" value="1" onchange="calculate(this)">
                </div>

                <div class="field">
                    <label>Rate</label>
                    <input type="number" value="${product.rate}" onchange="calculate(this)">
                </div>

                <div class="field">
                    <label>Stone</label>
                    <input type="number" value="${product.stone}" onchange="calculate(this)">
                </div>

                <div class="field">
                    <label>GST %</label>
                    <select onchange="calculate(this)">
                        <option value="3">3%</option>
                        <option value="5">5%</option>
                    </select>
                </div>
            </div>

            <div class="total-row">
                <span>Total</span>
                <span>₹ <span class="total">0</span></span>
            </div>
        </div>
    `;

    itemsContainer.appendChild(card);
    calculate(card.querySelector("input"));
}

function toggleCard(header) {
    header.parentElement.classList.toggle("active");
}

function calculate(el) {
    const card = el.closest(".item-card");

    const qty = card.querySelectorAll("input")[0].value;
    const rate = card.querySelectorAll("input")[1].value;
    const stone = card.querySelectorAll("input")[2].value;
    const gst = card.querySelector("select").value;

    let gross = qty * rate + Number(stone);
    let gstAmount = gross * (gst / 100);
    let total = gross + gstAmount;

    card.querySelectorAll(".total").forEach(t => {
        t.innerText = total.toFixed(2);
    });
}

/* Add first item by default */
addItem();

</script>
</body>
</html>
